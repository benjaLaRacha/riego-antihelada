<!DOCTYPE html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icono-192.png">
<link rel="apple-touch-icon" href="icono-192.png">
<title>Riego antihelada</title>
<style>
  :root{
    --noche:#0E1A2B; --noche2:#16263D; --linea:#2A3E5C;
    --hielo:#BFE3EF; --agua:#57A8CC; --ambar:#E8A33D;
    --nieve:#EEF4F7; --gris:#8598AE; --rojo:#D9705E; --verde:#5FB98B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--noche);color:var(--nieve)}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  .wrap{max-width:640px;margin:0 auto;padding:18px 16px 60px}

  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px}
  header h1{font-size:17px;font-weight:650;margin:0;letter-spacing:-.01em}
  header .quien{font-size:13px;color:var(--gris);margin:2px 0 0}
  .engrane{background:none;border:1px solid var(--linea);border-radius:9px;color:var(--gris);
    font-size:20px;line-height:1;padding:8px 11px;cursor:pointer;flex:none}

  .sync{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);
    border:1px solid var(--linea);border-radius:9px;padding:9px 12px;margin-bottom:16px}
  .sync b{color:var(--ambar);font-weight:600}
  .sync.ok b{color:var(--verde)}

  .panel{background:var(--noche2);border:1px solid var(--linea);border-radius:14px;padding:22px 18px;margin-bottom:20px}
  .estado{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .punto{width:10px;height:10px;border-radius:50%;background:var(--gris);flex:none}
  .punto.on{background:var(--ambar);box-shadow:0 0 0 5px rgba(232,163,61,.18)}
  .estado span{font-size:14px;color:var(--gris)}
  .estado.on span{color:var(--ambar)}
  .reloj{font-size:58px;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;
    letter-spacing:-.02em;color:var(--hielo);margin:0 0 4px}
  .reloj small{font-size:18px;color:var(--gris);font-weight:400;margin-left:4px}
  .desde{color:var(--gris);font-size:14px;margin:0 0 20px}

  button{font:inherit;cursor:pointer;border:0;border-radius:10px}
  .big{display:block;width:100%;padding:22px;font-size:20px;font-weight:600;background:var(--agua);color:#06121E}
  .big.stop{background:var(--ambar)}
  .big:active{transform:translateY(1px)}
  :focus-visible{outline:2px solid var(--hielo);outline-offset:2px}

  .campos{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .campo{display:flex;flex-direction:column;gap:5px}
  .campo.full{grid-column:1/-1}
  label{font-size:13px;color:var(--gris)}
  input,textarea{font:inherit;color:var(--nieve);background:#0B1726;border:1px solid var(--linea);
    border-radius:8px;padding:12px 10px;width:100%}
  textarea{resize:vertical;min-height:62px}
  .hint{font-size:12.5px;color:var(--gris);line-height:1.45}
  .mini{background:transparent;border:1px solid var(--linea);color:var(--nieve);padding:12px 16px;font-size:14px}
  .mini.pri{background:var(--hielo);color:#06121E;border-color:var(--hielo);font-weight:600}
  .fila{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  h2{font-size:14px;font-weight:600;margin:26px 0 10px;color:var(--hielo)}
  .noche{border:1px solid var(--linea);border-radius:11px;padding:13px;margin-bottom:9px;background:var(--noche2)}
  .noche .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .noche .fecha{font-weight:600;font-size:15px}
  .noche .hrs{font-variant-numeric:tabular-nums;color:var(--hielo);font-weight:600;white-space:nowrap}
  .noche .det{color:var(--gris);font-size:13px;margin-top:4px}
  .marca{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .marca.si{background:var(--verde)} .marca.no{background:var(--ambar)}
  .link{background:none;border:0;color:var(--gris);font-size:13px;text-decoration:underline;padding:4px 0}
  .vacio{color:var(--gris);font-size:14px;padding:16px;border:1px dashed var(--linea);border-radius:11px;text-align:center}
  .aviso{padding:11px 13px;border-radius:10px;font-size:13.5px;margin-bottom:14px}
  .aviso.mal{background:rgba(217,112,94,.12);border:1px solid var(--rojo);color:#F0C4BB}
  .aviso.bien{background:rgba(95,185,139,.12);border:1px solid var(--verde);color:#BFE7D2}

  dialog{background:var(--noche2);color:var(--nieve);border:1px solid var(--linea);border-radius:14px;
    padding:20px;max-width:440px;width:calc(100% - 32px)}
  dialog::backdrop{background:rgba(5,10,18,.72)}
  dialog h3{margin:0 0 4px;font-size:17px}
  dialog p.sub{color:var(--gris);font-size:13px;margin:0 0 16px}
  @media (max-width:520px){ .campos{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Riego antihelada</h1>
      <p class="quien" id="quien">Sin configurar</p>
    </div>
    <button class="engrane" id="btnConfig" aria-label="Configuración">⚙</button>
  </header>

  <div id="aviso"></div>

  <div class="sync" id="sync">
    <span id="syncTxt">Revisando…</span>
  </div>

  <div class="panel">
    <div class="estado" id="estado">
      <i class="punto" id="punto"></i><span id="estadoTxt">Sin turno abierto</span>
    </div>
    <p class="reloj" id="reloj">0:00 <small>h</small></p>
    <p class="desde" id="desde">Aprieta el botón al encender el generador.</p>
    <button class="big" id="btnPrincipal">Partió el riego</button>

    <div id="detalle" hidden>
      <div class="campos">
        <div class="campo"><label for="inicio">Partida del riego</label><input id="inicio" type="time"></div>
        <div class="campo"><label for="termino">Corte del riego</label><input id="termino" type="time"></div>
        <div class="campo full"><label for="tmin">Temperatura mínima del huerto (°C)</label><input id="tmin" type="number" step="0.1" inputmode="decimal" placeholder="-2.5"></div>
        <div class="campo"><label for="hi">Horómetro al partir</label><input id="hi" type="number" step="0.1" inputmode="decimal"></div>
        <div class="campo"><label for="hf">Horómetro al cortar</label><input id="hf" type="number" step="0.1" inputmode="decimal"></div>
        <div class="campo full"><label for="obs">Observaciones</label>
          <textarea id="obs" placeholder="¿Goteaba libre el hielo al cortar? ¿Falla de equipo?"></textarea></div>
        <div class="campo full"><p class="hint">Corta recién cuando el hielo se derrita solo y el agua gotee libre. Cortar antes quema más que la helada.</p></div>
      </div>
      <div class="fila">
        <button class="mini pri" id="btnGuardar">Guardar la noche</button>
        <button class="mini" id="btnCancelar">Volver</button>
      </div>
    </div>
  </div>

  <h2>Últimas noches</h2>
  <div id="historial"></div>
</div>

<dialog id="dlgConfig">
  <h3>Configuración</h3>
  <p class="sub">Se llena una sola vez por teléfono.</p>
  <div class="campos">
    <div class="campo full"><label for="cNombre">Nombre del trabajador</label><input id="cNombre" autocomplete="off"></div>
    <div class="campo full"><label for="cUrl">Dirección de la planilla (URL del Apps Script)</label><input id="cUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
    <div class="campo full"><label for="cToken">Clave</label><input id="cToken" autocomplete="off"></div>
  </div>
  <div class="fila">
    <button class="mini pri" id="cGuardar">Guardar</button>
    <button class="mini" id="cProbar">Probar conexión</button>
    <button class="mini" id="cCerrar">Cerrar</button>
  </div>
  <p class="hint" id="cResultado" style="margin-top:12px"></p>
</dialog>
<script>
/* ---------- almacenamiento local con respaldo en memoria ---------- */
const mem = {};
let localOk = true;
const LS = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ localOk=false; return mem[k] ?? null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ localOk=false; mem[k]=v; } }
};

let cfg    = JSON.parse(LS.get('ah:cfg')  || '{"nombre":"","url":"","token":""}');
let regs   = JSON.parse(LS.get('ah:regs') || '[]');
let activo = JSON.parse(LS.get('ah:act')  || 'null');
let tick = null, sincronizando = false;

const $ = id => document.getElementById(id);
const dosDig = n => String(n).padStart(2,'0');
const num = n => Number(n).toLocaleString('es-CL',{minimumFractionDigits:1,maximumFractionDigits:1});
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function grabar(){
  LS.set('ah:cfg', JSON.stringify(cfg));
  LS.set('ah:regs', JSON.stringify(regs));
  LS.set('ah:act', JSON.stringify(activo));
}
function avisar(txt, clase){
  $('aviso').innerHTML = txt ? '<div class="aviso '+(clase||'mal')+'">'+txt+'</div>' : '';
}

/* ---------- fechas y horas ---------- */
function nocheDe(d){ const x=new Date(d); if(x.getHours()<12) x.setDate(x.getDate()-1);
  return x.getFullYear()+'-'+dosDig(x.getMonth()+1)+'-'+dosDig(x.getDate()); }
function horaDe(d){ return dosDig(d.getHours())+':'+dosDig(d.getMinutes()); }
function horas(i,f){ if(!i||!f) return 0;
  const [a,b]=i.split(':').map(Number), [c,e]=f.split(':').map(Number);
  let m=(c*60+e)-(a*60+b); if(m<0) m+=1440; return m/60; }
function hhmm(h){ const t=Math.round(h*60); return Math.floor(t/60)+':'+dosDig(t%60); }
function fechaLarga(f){ const [y,m,d]=f.split('-').map(Number);
  const s=new Date(y,m-1,d).toLocaleDateString('es-CL',{weekday:'short',day:'numeric',month:'short'});
  return s.charAt(0).toUpperCase()+s.slice(1); }

/* ---------- sincronización ---------- */
async function enviar(reg){
  const cuerpo = {
    token: cfg.token, id: reg.id, fecha: reg.fecha, trabajador: reg.trabajador,
    inicio: reg.inicio, termino: reg.termino, horas: +horas(reg.inicio,reg.termino).toFixed(2),
    tmin: reg.tmin, hi: reg.hi, hf: reg.hf,
    horasGen: (reg.hi!=null && reg.hf!=null && reg.hf>=reg.hi) ? +(reg.hf-reg.hi).toFixed(2) : null,
    obs: reg.obs, creado: reg.creado
  };
  const r = await fetch(cfg.url, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},   // evita el preflight que Apps Script rechaza
    body: JSON.stringify(cuerpo)
  });
  const j = await r.json();
  if(!j.ok) throw new Error(j.error || 'rechazado');
  return true;
}

async function sincronizar(manual){
  if(sincronizando) return;
  const pend = regs.filter(r => !r.subido);
  if(!cfg.url || !cfg.token){ pintarSync(); return; }
  if(!pend.length){ pintarSync(); return; }
  if(!navigator.onLine){ pintarSync(); return; }
  sincronizando = true; pintarSync();
  for(const r of pend){
    try{ await enviar(r); r.subido = true; grabar(); }
    catch(e){ break; }   // sin señal o error: se reintenta después
  }
  sincronizando = false;
  grabar(); pintarSync(); pintarHistorial();
  if(manual){
    const q = regs.filter(r=>!r.subido).length;
    avisar(q ? 'Quedan '+q+' noche(s) por subir. Se van a mandar solas cuando haya señal.'
             : 'Todo subido a la planilla.', q ? 'mal' : 'bien');
  }
}

function pintarSync(){
  const pend = regs.filter(r=>!r.subido).length;
  const el = $('sync');
  if(!cfg.url || !cfg.token){
    el.className='sync'; $('syncTxt').innerHTML='Falta configurar la planilla. Toca el engranaje.'; return;
  }
  if(sincronizando){ el.className='sync'; $('syncTxt').textContent='Subiendo…'; return; }
  if(pend){ el.className='sync'; $('syncTxt').innerHTML='<b>'+pend+' noche(s) sin subir.</b> Se suben solas cuando haya señal.'; }
  else{ el.className='sync ok'; $('syncTxt').innerHTML='<b>Todo al día</b> con la planilla.'; }
}

/* ---------- panel ---------- */
function pintarPanel(){
  const on = !!activo;
  $('punto').className='punto'+(on?' on':'');
  $('estado').className='estado'+(on?' on':'');
  $('estadoTxt').textContent = on ? 'Riego andando' : 'Sin turno abierto';
  $('btnPrincipal').textContent = on ? 'Cortó el riego' : 'Partió el riego';
  $('btnPrincipal').className = 'big'+(on?' stop':'');
  clearInterval(tick);
  if(on){
    $('desde').textContent = 'Partió a las '+activo.inicio+', noche del '+fechaLarga(activo.fecha)+'.';
    const correr = () => { $('reloj').innerHTML = hhmm((Date.now()-activo.t0)/3600000)+' <small>h</small>'; };
    correr(); tick = setInterval(correr, 20000);
  }else{
    $('reloj').innerHTML='0:00 <small>h</small>';
    $('desde').textContent='Aprieta el botón al encender el generador.';
  }
}

function principal(){
  if(!activo){
    const ahora = new Date();
    activo = { fecha: nocheDe(ahora), inicio: horaDe(ahora), t0: ahora.getTime() };
    grabar(); pintarPanel();
  }else{
    abrirDetalle(activo.fecha, activo.inicio, horaDe(new Date()));
  }
}

function abrirDetalle(fecha, ini, fin, reg){
  const d = $('detalle');
  d.hidden = false;
  d.dataset.fecha = fecha;
  d.dataset.edit = reg ? reg.id : '';
  $('inicio').value=ini||''; $('termino').value=fin||'';
  $('tmin').value = reg && reg.tmin!=null ? reg.tmin : '';
  $('hi').value = reg && reg.hi!=null ? reg.hi : '';
  $('hf').value = reg && reg.hf!=null ? reg.hf : '';
  $('obs').value = reg ? (reg.obs||'') : '';
  $('btnPrincipal').hidden = true;
  d.scrollIntoView({behavior:'smooth', block:'center'});
}
function cerrarDetalle(){ $('detalle').hidden=true; $('btnPrincipal').hidden=false; }

function guardarNoche(){
  const d=$('detalle'), gi=parseFloat($('hi').value), gf=parseFloat($('hf').value);
  if(!$('inicio').value || !$('termino').value){
    avisar('Falta la hora de partida o la de corte.'); return;
  }
  const reg = {
    id: d.dataset.edit || (Date.now()+'-'+Math.random().toString(36).slice(2,7)),
    fecha: d.dataset.fecha,
    trabajador: cfg.nombre || 'Sin nombre',
    inicio: $('inicio').value, termino: $('termino').value,
    tmin: $('tmin').value===''?null:parseFloat($('tmin').value),
    hi: isNaN(gi)?null:gi, hf: isNaN(gf)?null:gf,
    obs: $('obs').value.trim(),
    creado: new Date().toISOString(),
    subido: false
  };
  const i = regs.findIndex(r=>r.id===reg.id);
  if(i>=0) regs[i]=reg; else regs.unshift(reg);
  regs.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  activo = null;
  grabar(); cerrarDetalle(); avisar(''); pintarPanel(); pintarHistorial(); sincronizar();
}

function pintarHistorial(){
  const l = regs.slice(0,12);
  $('historial').innerHTML = l.length ? l.map(r=>{
    const gen = (r.hi!=null&&r.hf!=null&&r.hf>=r.hi)?(r.hf-r.hi):null;
    const det = [r.inicio+' a '+r.termino,
      r.tmin!=null?'mín '+num(r.tmin)+' °C':null,
      gen!=null?'generador '+num(gen)+' h':null].filter(Boolean).map(esc).join(' · ');
    return '<div class="noche"><div class="top">'+
      '<span class="fecha"><i class="marca '+(r.subido?'si':'no')+'"></i>'+esc(fechaLarga(r.fecha))+'</span>'+
      '<span class="hrs">'+hhmm(horas(r.inicio,r.termino))+' h</span></div>'+
      '<div class="det">'+det+'</div>'+
      '<button class="link" data-edit="'+r.id+'">Corregir</button></div>';
  }).join('') : '<div class="vacio">Todavía no hay noches registradas.</div>';
}

/* ---------- configuración ---------- */
function abrirConfig(){
  $('cNombre').value=cfg.nombre; $('cUrl').value=cfg.url; $('cToken').value=cfg.token;
  $('cResultado').textContent='';
  $('dlgConfig').showModal();
}

/* ---------- eventos ---------- */
$('btnPrincipal').onclick = principal;
$('btnGuardar').onclick = guardarNoche;
$('btnCancelar').onclick = () => { cerrarDetalle(); avisar(''); };
$('btnConfig').onclick = abrirConfig;
$('cCerrar').onclick = () => $('dlgConfig').close();
$('cGuardar').onclick = () => {
  cfg = { nombre:$('cNombre').value.trim(), url:$('cUrl').value.trim(), token:$('cToken').value.trim() };
  grabar(); $('quien').textContent = cfg.nombre || 'Sin configurar';
  $('dlgConfig').close(); pintarSync(); sincronizar(true);
};
$('cProbar').onclick = async () => {
  const url=$('cUrl').value.trim();
  $('cResultado').textContent='Probando…';
  try{
    const r = await fetch(url+'?ping=1');
    const j = await r.json();
    $('cResultado').textContent = j.ok ? 'Conectado con la planilla «'+j.hoja+'».' : 'Responde, pero con error: '+j.error;
  }catch(e){ $('cResultado').textContent='No se pudo conectar. Revisa la dirección y que haya señal.'; }
};
$('historial').onclick = e => {
  const id = e.target.dataset.edit;
  if(id){ const r = regs.find(x=>x.id===id); if(r) abrirDetalle(r.fecha, r.inicio, r.termino, r); }
};
$('sync').onclick = () => sincronizar(true);
window.addEventListener('online', () => sincronizar());
setInterval(() => sincronizar(), 120000);

/* ---------- arranque ---------- */
$('quien').textContent = cfg.nombre || 'Sin configurar';
pintarPanel(); pintarHistorial(); pintarSync(); sincronizar();
if(!localOk) avisar('Este teléfono no está guardando los datos localmente. Instala la app desde su dirección web, no desde una vista previa.');

if('serviceWorker' in navigator && location.protocol==='https:'){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
